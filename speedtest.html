<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>System Monitor | Shinorail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --p: #d4af37; --bg: #0f172a; --card: #1e293b; --txt: #f8fafc; --sub: #94a3b8; }
        body { font-family: sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 50px; }
        .main-card { background: var(--card); border: 1px solid rgba(212, 175, 55, 0.4); border-radius: 20px; padding: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative; }
        .speed-val { font-size: 5rem; font-weight: 800; color: var(--p); margin: 5px 0; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .info-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; text-align: left; border: 1px solid rgba(255,255,255,0.03); }
        .info-box span { display: block; font-size: 0.6rem; color: var(--sub); text-transform: uppercase; }
        .info-box b { font-size: 0.85rem; color: var(--txt); }
        .bar-container { width: 100%; height: 5px; background: rgba(255,255,255,0.1); margin: 20px 0; border-radius: 5px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--p); transition: width 0.1s; }
        button { width: 100%; background: var(--p); border: none; color: var(--bg); padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .sub-btn { background: rgba(255,255,255,0.05); color: var(--p); border: 1px solid var(--p); padding: 12px; margin-top: 10px; }
        .back-link { display: block; text-align: center; margin-top: 25px; color: var(--sub); text-decoration: none; font-size: 0.9rem; }
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10000; align-items: center; justify-content: center; }
        .ad-content { background: var(--card); border: 1px solid var(--p); border-radius: 24px; padding: 25px; width: 90%; max-width: 400px; text-align: center; }
        .timer-badge { background: rgba(212,175,55,0.1); color: var(--p); padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; margin-bottom: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div id="capture-area">
        <div class="main-card">
            <div id="mode-label" style="font-size:0.7rem; color:var(--sub); letter-spacing: 2px;">SHINORAIL NETWORK SYSTEM</div>
            <div class="speed-val" id="speed">0.0</div>
            <div id="status" style="font-size:0.8rem; color:var(--p); font-weight: bold;">SYSTEM READY</div>
            <div class="bar-container"><div class="bar-fill" id="bar"></div></div>
            <div id="adTimerBadge" class="timer-badge" style="display:none;">
                <i class="fa-solid fa-clock"></i> 24h非表示中: <span id="timeLeft">--:--:--</span>
            </div>
            <div class="info-grid" id="specs">
                <div class="info-box"><span>IP ADDRESS</span><b id="ip">---</b></div>
                <div class="info-box"><span>ISP</span><b id="isp">---</b></div>
                <div class="info-box"><span>PING</span><b id="ping">---</b></div>
                <div class="info-box"><span>DEVICE</span><b id="os">---</b></div>
                <div class="info-box"><span>BATTERY</span><b id="bat">---</b></div>
                <div class="info-box"><span>TIME</span><b id="time">---</b></div>
            </div>
            <div style="margin-top:20px; padding:10px; background:rgba(255,255,255,0.03); border-radius:10px; font-size:0.6rem; color:var(--sub); text-align:left; border-left:2px solid var(--p);">
                <i class="fa-solid fa-circle-exclamation"></i> <b>NOTICE:</b> 通信費は利用者負担です。広告収入で運営されています。
            </div>
        </div>
    </div>
    <button id="startBtn" onclick="runCheck()">RUN SPEED TEST</button>
    <div id="resultBtns" style="display:none;">
        <button class="sub-btn" onclick="saveAsImage()"><i class="fa-solid fa-camera"></i> 保存</button>
        <button class="sub-btn" onclick="copyShareUrl()"><i class="fa-solid fa-link"></i> 共有</button>
    </div>
    <a href="https://shinorail.github.io/multi-x-utility/menu.html" class="back-link">← メニューに戻る</a>
</div>

<div id="adModal">
    <div class="ad-content">
        <div style="min-height:250px; background:rgba(0,0,0,0.3); border-radius:15px; margin-bottom:20px; display:flex; align-items:center; justify-content:center;">
            <script src="https://adm.shinobi.jp/o/2791c03bc086135607731d2a0eb484fd"></script>
        </div>
        <button onclick="closeAdAndLock()">広告を閉じて24h非表示</button>
    </div>
</div>

<script>
    const AD_LOCK_KEY = 'shinorail_ad_lock';
    const LOCK_TIME = 24 * 60 * 60 * 1000;

    async function init() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('s')) {
            document.getElementById('speed').innerText = params.get('s');
            document.getElementById('ip').innerText = params.get('i') || "Private";
            document.getElementById('ping').innerText = params.get('p') + " ms";
            document.getElementById('mode-label').innerText = "SHARED RESULT";
            return;
        }
        updateAdTimer();
        setInterval(updateAdTimer, 1000);
        document.getElementById('os').innerText = navigator.platform;
        document.getElementById('time').innerText = new Date().toLocaleTimeString();
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            document.getElementById('ip').innerText = data.ip;
            document.getElementById('isp').innerText = data.org;
        } catch(e) {}
    }

    function updateAdTimer() {
        const lastTime = localStorage.getItem(AD_LOCK_KEY);
        if (!lastTime) return;
        const diff = parseInt(lastTime) + LOCK_TIME - new Date().getTime();
        if (diff <= 0) { localStorage.removeItem(AD_LOCK_KEY); document.getElementById('adTimerBadge').style.display='none'; }
        else {
            document.getElementById('adTimerBadge').style.display='inline-block';
            const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
            document.getElementById('timeLeft').innerText = `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
    }

    async function runCheck() {
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        document.getElementById('status').innerText = "TESTING...";
        const bar = document.getElementById('bar');
        
        // ★ 自サーバー内のダミーファイルを読み込む（CORSエラー回避）
        const testUrl = "testbin?n=" + Math.random();
        const startTime = performance.now();
        
        try {
            const response = await fetch(testUrl);
            if (!response.ok) throw new Error();
            const reader = response.body.getReader();
            let received = 0;
            const total = response.headers.get('Content-Length') || 5242880;

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                received += value.length;
                bar.style.width = (received/total*100) + "%";
                const dur = (performance.now() - startTime) / 1000;
                document.getElementById('speed').innerText = ((received*8)/(dur*1024*1024)).toFixed(1);
            }
            document.getElementById('ping').innerText = Math.round(performance.now() - startTime - (dur*1000)) + " ms";
            document.getElementById('status').innerText = "COMPLETE";
            document.getElementById('resultBtns').style.display = "block";
            if (!localStorage.getItem(AD_LOCK_KEY)) setTimeout(() => { document.getElementById('adModal').style.display='flex'; }, 800);
        } catch(e) {
            document.getElementById('status').innerText = "ERROR!";
            alert("自分のリポジトリに 'testbin' があるか確認してください。");
        }
        btn.disabled = false;
    }

    function closeAdAndLock() { localStorage.setItem(AD_LOCK_KEY, new Date().getTime().toString()); document.getElementById('adModal').style.display='none'; updateAdTimer(); }
    function saveAsImage() { html2canvas(document.getElementById('capture-area'), { backgroundColor: "#0f172a", scale: 2 }).then(canvas => { const link = document.createElement('a'); link.download = `shinorail_speed.png`; link.href = canvas.toDataURL(); link.click(); }); }
    function copyShareUrl() { const url = `${window.location.href.split('?')[0]}?s=${document.getElementById('speed').innerText}&i=${document.getElementById('ip').innerText}&p=${document.getElementById('ping').innerText.replace(" ms","")}`; navigator.clipboard.writeText(url); alert("URLをコピーしました！"); }

    init();
</script>
</body>
</html>
