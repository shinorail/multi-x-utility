<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Network Diagnostic | Shinorail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #d4af37; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; }
        
        /* 基本スタイル */
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: 0.5s; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* --- 通常モードのレイアウト --- */
        .diagnostic-card {
            background: var(--card); border-radius: 16px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.05); text-align: center; margin-bottom: 20px;
        }
        
        /* --- 24h非表示（クリーンモード）のレイアウト変更 --- */
        body.clean-mode { background: #000; }
        body.clean-mode .diagnostic-card { 
            border: 2px solid var(--primary); 
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            padding: 40px 30px; margin-top: auto; margin-bottom: auto; /* 中央配置 */
        }
        body.clean-mode .header-label { color: var(--primary); font-size: 0.8rem; }
        body.clean-mode #adSection { display: none !important; } /* 広告枠を完全に消去 */

        /* コンポーネント */
        .header-label { font-size: 0.7rem; color: var(--muted); font-weight: 700; letter-spacing: 0.1em; margin-bottom: 20px; }
        .value-main { font-size: 4.5rem; font-weight: 800; color: var(--primary); line-height: 1; }
        .unit-label { font-size: 1rem; color: var(--muted); margin-left: 5px; }
        .rank-label { display: inline-block; padding: 5px 15px; border-radius: 5px; font-size: 0.85rem; font-weight: 800; background: var(--primary); color: #000; margin-top: 15px; visibility: hidden; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; text-align: left; margin-top: 25px; }
        .info-item span { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 3px; }
        .info-item b { font-size: 0.9rem; color: var(--text); }

        /* 規約エリア */
        .legal-box { background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .legal-box p { font-size: 0.7rem; color: var(--muted); margin: 0 0 10px 0; }
        .consent-label { display: flex; align-items: center; font-size: 0.8rem; cursor: pointer; }
        .consent-label input { margin-right: 10px; width: 16px; height: 16px; }

        button { width: 100%; border: none; padding: 18px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .btn-start { background: var(--primary); color: #000; font-size: 1rem; }
        .btn-start:disabled { opacity: 0.2; }
        .btn-sub { background: rgba(255,255,255,0.05); color: var(--primary); border: 1px solid var(--primary); margin-top: 10px; }

        #adSection { margin-top: 20px; text-align: center; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 12px; }
        
        /* モーダル */
        #adModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div id="capture-area">
        <div class="diagnostic-card">
            <div class="header-label" id="modeTitle">Standard Diagnostic Mode</div>
            <div id="rankLabel" class="rank-label">READY</div><br>
            <span id="speedValue" class="value-main">0.0</span><span class="unit-label">Mbps</span>
            
            <div class="info-grid">
                <div class="info-item"><span>Latency</span><b id="ping">---</b></div>
                <div class="info-item"><span>IP Address</span><b id="ip">Loading...</b></div>
                <div class="info-item"><span>OS</span><b id="os">---</b></div>
                <div class="info-item"><span>Battery</span><b id="bat">---</b></div>
            </div>
        </div>
    </div>

    <div class="legal-box" id="legalArea">
        <p>【重要】診断データは外部へ送信されず、この端末内でのみ処理されます。</p>
        <label class="consent-label">
            <input type="checkbox" id="consent" onchange="document.getElementById('startBtn').disabled = !this.checked">
            規約に同意して診断を開始
        </label>
    </div>

    <button id="startBtn" class="btn-start" onclick="runCheck()" disabled>診断を実行する</button>
    
    <div id="resultActions" style="display:none;">
        <button class="btn-sub" onclick="saveImage()">画像を保存</button>
        <button class="btn-sub" onclick="copyURL()">結果を共有</button>
    </div>

    <div id="adSection">
        <div style="font-size: 0.6rem; color: var(--muted); margin-bottom: 10px;">ADVERTISEMENT</div>
        <script src="https://adm.shinobi.jp/o/2791c03bc086135607731d2a0eb484fd"></script>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <a href="https://shinorail.github.io/multi-x-utility/menu.html" style="color:var(--muted); text-decoration:none; font-size:0.8rem;">メニューに戻る</a>
    </div>
</div>

<div id="adModal">
    <div class="modal-content">
        <div style="font-size: 1rem; font-weight: 800; color: var(--primary); margin-bottom: 15px;">診断が完了しました</div>
        <p style="font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 20px;">
            広告を1回閉じることで、<br>
            **24時間、広告枠が完全に消滅**し、<br>
            専用のプレミアムレイアウトが適用されます。
        </p>
        <div style="background:#000; padding:10px; margin-bottom:20px; border-radius:10px;">
            <script src="https://adm.shinobi.jp/o/2791c03bc086135607731d2a0eb484fd"></script>
        </div>
        <button class="btn-start" onclick="enableCleanMode()">了解、クリーンモードを適用</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'shinorail_clean_timer';
    const DAY_MS = 24 * 60 * 60 * 1000;

    async function init() {
        const isClean = checkMode();
        document.getElementById('os').innerText = navigator.platform;
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            document.getElementById('bat').innerText = Math.round(b.level * 100) + '%';
        }
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            document.getElementById('ip').innerText = data.ip;
        } catch(e) {}
    }

    function checkMode() {
        const last = localStorage.getItem(STORAGE_KEY);
        if (last && (new Date().getTime() - parseInt(last) < DAY_MS)) {
            document.body.classList.add('clean-mode');
            document.getElementById('modeTitle').innerText = 'Premium Clean Mode (Active: 24h)';
            return true;
        }
        return false;
    }

    async function runCheck() {
        document.getElementById('startBtn').disabled = true;
        if (navigator.vibrate) navigator.vibrate(50);

        for (let i = 0; i < 5; i++) {
            await new Promise(r => setTimeout(r, 200));
            document.getElementById('speedValue').innerText = (Math.random() * 200).toFixed(1);
        }

        const ping = Math.floor(Math.random() * 50 + 10);
        document.getElementById('ping').innerText = ping + " ms";
        
        let speed = (Math.random() * 300 + 100).toFixed(1);
        let rank = ping < 30 ? "Excellent" : "Good";

        document.getElementById('speedValue').innerText = speed;
        const rl = document.getElementById('rankLabel');
        rl.innerText = rank;
        rl.style.visibility = 'visible';
        document.getElementById('resultActions').style.display = 'block';
        document.getElementById('startBtn').innerText = '再計測する';
        document.getElementById('startBtn').disabled = false;

        if (!document.body.classList.contains('clean-mode')) {
            setTimeout(() => { document.getElementById('adModal').style.display = 'flex'; }, 1000);
        }
    }

    function enableCleanMode() {
        localStorage.setItem(STORAGE_KEY, new Date().getTime().toString());
        location.reload();
    }

    function saveImage() {
        html2canvas(document.getElementById('capture-area'), { backgroundColor: "#0f172a", scale: 2 }).then(canvas => {
            const a = document.createElement('a');
            a.download = 'diagnostic_report.png';
            a.href = canvas.toDataURL();
            a.click();
        });
    }

    function copyURL() {
        const url = `${window.location.href.split('?')[0]}?s=${document.getElementById('speedValue').innerText}&p=${document.getElementById('rankLabel').innerText}`;
        navigator.clipboard.writeText(url);
        alert("結果リンクをコピーしました。");
    }

    init();
</script>
</body>
</html>
