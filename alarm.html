<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Alarm | Multi-X Utility</title>
<style>
:root { --p: #d4af37; --bg: #0f172a; --card: #1e293b; --txt: #f8fafc; --red: #ef4444; --sub: #94a3b8; --blue: #3b82f6; }
body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--txt); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); box-sizing: border-box; }
@keyframes alarm-flash { 0% { background: var(--bg); } 50% { background: #7f1d1d; } 100% { background: var(--bg); } }
.flashing { animation: alarm-flash 0.5s infinite; }
.clock { font-size: 3.5rem; font-family: "Courier New", monospace; margin: 20px 0; color: var(--p); text-shadow: 0 0 20px rgba(212,175,55,0.3); }
.setup-area { width: 100%; max-width: 350px; background: var(--card); padding: 30px; border-radius: 25px; text-align: center; border: 1px solid rgba(212,175,55,0.2); box-sizing: border-box; }
input[type="time"] { width: 100%; background: rgba(0,0,0,0.5); border: 2px solid var(--p); color: white; padding: 15px; font-size: 1.8rem; border-radius: 15px; margin-bottom: 20px; box-sizing: border-box; outline:none; }
.btn { width: 100%; padding: 18px; border-radius: 50px; border: none; background: var(--p); color: #000; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
.btn-blue { background: var(--blue); color: white; font-size: 0.9rem; padding: 12px; }
.btn-disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed !important; opacity: 0.6; }
.btn-stop { background: var(--red); color: white; display: none; }
#status { margin-top: 20px; font-size: 0.85rem; color: var(--sub); font-weight: bold; }

#consent-dialog { display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; }
.consent-card { background:var(--card); border:2px solid var(--p); padding:30px; border-radius:25px; max-width:350px; text-align:center; }
</style>
</head>
<body onclick="unlockAudio()">

<div id="consent-dialog">
    <div class="consent-card">
        <h2 style="color:var(--p); margin-top:0;">利用同意</h2>
        <p style="font-size:0.85rem; text-align:left; line-height:1.6; color:var(--txt);">
            本アプリを確実に動作させるため、以下の機能を有効にします：<br><br>
            1. <b>スリープ防止</b>：アラーム作動まで画面を消灯しません。<br>
            2. <b>音出し許可</b>：ブラウザの制限を解除します。<br>
            3. <b>BT監視</b>：接続切れを検知します（対応機種のみ）。
        </p>
        <button class="btn" onclick="acceptConsent()">同意して開始する</button>
    </div>
</div>

<div class="clock" id="clock">00:00:00</div>

<div class="setup-area">
    <input type="time" id="alarmTime">
    <button id="btWatchBtn" class="btn btn-blue" onclick="watchBluetooth()">🔗 Bluetooth切断を監視</button>
    <button id="setBtn" class="btn" onclick="askPermission()">SET ALARM</button>
    <button id="stopBtn" class="btn btn-stop" onclick="stopAlarm()">STOP ALARM</button>
    <div id="status">WAKE LOCK: OFF</div>
</div>

<audio id="alarmSound" loop preload="auto">
    <source src="alarm.mp3" type="audio/mpeg">
</audio>

<script>
let wakeLock = null;
let isAudioUnlocked = false;

function checkBTSupport() {
    const btn = document.getElementById('btWatchBtn');
    if (!navigator.bluetooth) {
        btn.classList.add('btn-disabled');
        btn.innerHTML = "🚫 Bluetooth監視非対応(Safari等)";
        btn.onclick = () => alert("お使いのブラウザはBluetooth監視に対応していません。通常のアラームとしてご利用ください。");
    }
}

async function acceptConsent() {
    document.getElementById('consent-dialog').style.display = 'none';
    unlockAudio();
    requestWakeLock();
    checkBTSupport();
}

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            document.getElementById('status').innerText = "WAKE LOCK: ON (常時点灯)";
        }
    } catch (err) {
        document.getElementById('status').innerText = "WAKE LOCK: ERROR";
    }
}

function unlockAudio() {
    if (isAudioUnlocked) return;
    const audio = document.getElementById('alarmSound');
    audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        isAudioUnlocked = true;
    }).catch(e => {});
}

setInterval(() => {
    const clock = document.getElementById('clock');
    if(clock) clock.innerText = new Date().toTimeString().split(' ')[0];
}, 1000);
</script>
<script src="alarm-core.js"></script>
</body>
</html>
